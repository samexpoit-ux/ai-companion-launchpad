# /etc/nginx/sites-available/nexuraai
# nexuraai.dev + www.nexuraai.dev  ->  Node SSR server on 127.0.0.1:3000
# certbot --nginx will add the 443 server block + HTTP redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name nexuraai.dev www.nexuraai.dev;

    client_max_body_size 25m;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # long-cache hashed build assets
    location /_build/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # streaming AI responses
        proxy_buffering off;
    }
}
