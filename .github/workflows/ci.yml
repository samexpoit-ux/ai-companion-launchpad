name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Accessibility checks (mobile drawer, focus trap, labels)
        run: bun run test:a11y
        env:
          # Optional: set these repository secrets to also cover the
          # authenticated dashboard/workspace drawers. Without them the
          # authenticated specs skip and the public axe scans still run.
          A11Y_TEST_EMAIL: ${{ secrets.A11Y_TEST_EMAIL }}
          A11Y_TEST_PASSWORD: ${{ secrets.A11Y_TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
